name: Sequence Detector RTL CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V
      - name: RTL self-checking simulation
        run: |
          iverilog -g2012 -s tb -o sim_rtl seq_det.v tb.v
          vvp sim_rtl | tee rtl.log
          python - <<'PY'
          import re
          s = open("rtl.log").read()
          m = re.search(r"RESULT checks=(\d+) detections=(\d+) errors=(\d+) (PASS|FAIL)", s)
          assert m, "RTL simulation summary missing"
          checks, detections, errors = map(int, m.group(1, 2, 3))
          assert checks >= 250000 and detections > 0 and errors == 0 and m.group(4) == "PASS", m.groups()
          print("RTL exhaustive/reset/random regression PASS", m.groups())
          PY
      - name: Gate-level self-checking simulation
        run: |
          iverilog -g2012 -DGATE -s tb -o sim_gate seq_det_gate.v tb.v
          vvp sim_gate | tee gate.log
          python - <<'PY'
          import re
          s = open("gate.log").read()
          m = re.search(r"RESULT checks=(\d+) detections=(\d+) errors=(\d+) (PASS|FAIL)", s)
          assert m, "Gate simulation summary missing"
          checks, detections, errors = map(int, m.group(1, 2, 3))
          assert checks >= 250000 and detections > 0 and errors == 0 and m.group(4) == "PASS", m.groups()
          print("Gate-level exhaustive/reset/random regression PASS", m.groups())
          PY
